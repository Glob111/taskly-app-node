name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm --prefix backend ci
      - run: npm --prefix backend run typecheck
      - run: npm --prefix backend run test:coverage

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run test:coverage

  # Tests for the agent tooling itself (deterministic logic, no secrets, no LLM).
  agent-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm --prefix backend ci   # reuses the vitest binary
      - run: npx --no-install vitest run --root ../.github/agent
        working-directory: backend
      - run: node .github/agent/cli.ts --dry-run
